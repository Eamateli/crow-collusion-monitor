[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crow"
version = "0.1.0"
description = "Crow: a passive monitor for multi-agent coding harnesses"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ermal Mateli" }]
requires-python = ">=3.12,<3.13"
# Pinned: the Modal image installs these exact versions (experiments/modal_app.py).
dependencies = [
    "modal==1.6.2",
    "openai==3.37.0",
    "python-dotenv==1.2.4",
    "rich==15.0.0",
    "numpy==2.5.4",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
    "pre-commit==4.7.0",
]

[tool.setuptools.packages.find]
include = ["crow*", "env*", "experiments*", "analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
# Verbatim copies of Modal dashboard snippets, and Markdown (ruff would rewrite its code blocks).
extend-exclude = ["docs/endpoint_examples", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
